<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="../scripts/form.js"></script>

    <title>FormView</title>
</head>
<body class="form-body">
    <nav class="navbar-expand-lg navbar-light menuheader">
        <aside class="aside">
            <div class="search-bar">
                <button type="button" class="btn"><a href="../index.html">Home</a></button>
                <button type="button" class="btn"><a href="../statics/history.html">History</a></button>
                <button type="button" class="btn"><a href="../statics/bios.html">Biographies</a></button>
                <button type="button" class="btn"><a href="">Add Movies</a></button>
            </div>
        </aside>
    </nav>

    <div class="addForm">
        <form class="form">
            <p class="title">Add Movies</p>

            <div class="flex">
                <label>
                    <input class="input" type="text" id="title" required>
                    <span>Title</span>
                </label>
            </div>

            <div class="flex">
                <label>
                    <input class="input" type="number" id="year" required>
                    <span>Year</span>
                </label>

                <label>
                    <input class="input" type="text" id="director" required>
                    <span>Director</span>
                </label>
            </div>

            
            <div class="flex" required>
                <div id="genre">
                    <h5>Genres</h5>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="Action" value="Action">Action
                    </label>
                    <label>
                        <input type="checkbox" name="Adventure" value="Adventure">Adventure
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="Animation" value="Animation">Animation
                    </label>
                    <label>
                        <input type="checkbox" name="Comedy" value="Comedy">Comedy
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="Drama" value="Drama">Drama
                    </label>
                    <label>
                        <input type="checkbox" name="Fantasy" value="Fantasy">Fantasy
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="Mystery" value="Mystery">Mystery
                    </label>
                    <label>
                        <input type="checkbox" name="Sci-Fi" value="Sci-Fi">Sci-Fi
                    </label>
                </div>
            </div>

            <div class="flex">
                <label>
                    <input class="input" type="text" id="duration" required>
                    <span>Duration</span>
                </label>

                <label>
                    <input class="input" type="number" id="rate" required>
                    <span>Rate</span>
                </label>
            </div>

            <div class="flex">
                <label>
                    <input class="input" type="url" id="poster" required>
                    <span>Poster</span>
                </label>
            </div>

            <div class="flex">
                <button type="submit" id="send">Send</button>
                <button type="button" id="resetFields">Clean</button>
            </div>
        </form>

        <div id="errorMessages" style="color: red; background-color: rgba(165, 42, 42, 0.239);"></div>
    </div>
</body>
</html>
